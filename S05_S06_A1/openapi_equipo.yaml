openapi: 3.0.3

info:
  title: EcoAlert Tambopata — API REST consolidada del equipo
  version: 1.0.0
  description: |
    Contrato de la API REST del backend de **EcoAlert Tambopata** (enfoque *spec-first*).
    Este documento precede al código (S05-S06-A1) y a las pruebas (S09-A1): el código se
    construye para cumplirlo y las pruebas lo verifican.

    **Fuente de los requerimientos:** `SRS_equipo.md`, línea base v1.0. Alcance: RF-01 a RF-17 (Must).

    ## Trazabilidad
    Cada operación declara tres extensiones:
    - `x-acceptance-criteria`: criterios Given-When-Then del SRS (`RF-XX-AC-Y`) que la operación
      satisface y que se verifican con pruebas de API (`test_RF_09_AC_1`).
    - `x-e2e-support`: criterios marcados en el SRS como *Prueba E2E de interfaz* para los que la
      operación entrega los datos. Se verifican en la interfaz, no solo en la API.
    - `x-roles`: roles autorizados según la matriz de permisos (sección 2.3 del SRS).

    Un criterio del alcance sin operación asociada es un gap de diseño.

    ## Cobertura (SRS v1.0, 225 criterios)
    | Grupo | Criterios | Estado |
    |---|---|---|
    | Must verificables por API (RF-01 a RF-17) | 157 | 157 en `x-acceptance-criteria`; sin gaps |
    | Must E2E de interfaz | 9 | 9 en `x-e2e-support`; sin gaps |
    | Should (RF-18 a RF-26, RF-34 a RF-37) | 42 | Fuera del alcance de la v1.0 del contrato |
    | Could (RF-27 a RF-33, RF-38, RF-39) | 17 | Fuera del alcance de la v1.0 del contrato |

    Los criterios Should y Could no tienen operaciones a propósito: el contrato cubre el MVP.
    Cuando se incorpore un RF Should o Could, se agregan sus operaciones en una versión menor
    del contrato (1.x) antes de escribir el código.

    ## Autenticación (RNF-01, RF-01)
    Todas las operaciones exigen `Authorization: Bearer <JWT>`, salvo `POST /auth/sesion`.
    El JWT incluye `sub`, `rol` y `jti`. El servidor guarda la sesión asociada al `jti`:
    - cada solicitud renueva la última actividad;
    - tras 30 min sin actividad (PS-12) la sesión expira y la API responde 401 (RF-01-AC-4);
    - al cerrar sesión, el `jti` se invalida y el token deja de servir (RF-01-AC-6).

    Mientras el usuario tenga una contraseña temporal, toda operación distinta de
    `GET /auth/sesion`, `PUT /auth/password` y `DELETE /auth/sesion` responde 403 con el código
    `CAMBIO_PASSWORD_REQUERIDO` (RF-02-AC-4).

    ## Convenciones de respuesta
    | Código | Uso |
    |---|---|
    | 200 | Consulta o modificación exitosa |
    | 201 | Recurso creado; siempre incluye `Location` con la URL del recurso creado |
    | 202 | Proceso aceptado; `Location` apunta a `GET /trabajos/{trabajoId}` (RNF-04) |
    | 204 | Operación exitosa sin cuerpo |
    | 400 | Solicitud mal formada: JSON ilegible, multipart corrupto o parámetro con sintaxis inválida |
    | 401 | Sin token, token inválido, sesión expirada o cerrada; incluye `WWW-Authenticate` |
    | 403 | Rol sin permiso (RNF-02) o cambio de contraseña pendiente |
    | 404 | El recurso no existe |
    | 409 | Conflicto con el estado actual (correo duplicado, última cuenta de coordinación) |
    | 415 | Tipo de contenido no soportado (p. ej., PATCH sin `application/merge-patch+json`) |
    | 422 | El cuerpo es legible pero no cumple el esquema o una regla de negocio; o la clave de idempotencia se reutilizó con otro cuerpo |
    | 429 | Límite de solicitudes excedido; incluye `Retry-After` |
    | 500 | Error interno no previsto |
    | 503 | Servicio en mantenimiento o saturado; incluye `Retry-After` |

    Todos los errores se entregan como `application/problem+json` (RFC 9457) con el esquema
    `Error`. Los miembros de extensión `codigo` y `mensaje` son obligatorios; los mensajes están
    en español (RNF-06).

    ## Idempotencia
    Todos los POST que crean recursos o procesos exigen la cabecera `Idempotency-Key` (UUID).
    Un reintento con la misma clave y el mismo cuerpo dentro de 24 h devuelve la respuesta
    original sin repetir la operación; así, un reintento por corte de red no duplica una
    ingesta, un ajuste, una marca, un cambio de estado ni un análisis almacenado. La única
    excepción es `POST /auth/sesion`, porque iniciar sesión dos veces no tiene efectos
    acumulativos sobre los datos.

    ## Operaciones que no existen a propósito
    La API no expone borrado de cuentas (RF-02-AC-7), de zonas (RF-12-AC-17) ni modificación o
    borrado de análisis (RF-15-AC-3). Esos métodos responden 405 Method Not Allowed.
    Las cuentas se modifican solo con `PATCH /usuarios/{usuarioId}` (JSON Merge Patch); no hay PUT.

    ## Historial de cambios del contrato
    - **1.1.0** (antes de implementar; sin clientes afectados): `Idempotency-Key` en los POST de
      creación; PUT y PATCH de usuarios unificados en un PATCH parcial (`actualizarUsuario`);
      `Location` en todas las respuestas 201 y nuevos GET individuales de ajuste, marca y entrada
      del historial; errores como `application/problem+json`; `WWW-Authenticate` en 401;
      respuestas 429 y 503 en todas las operaciones.
    - **1.0.0**: versión inicial (RF-01 a RF-17).

    ## Sistemas de referencia (RD-10)
    Las geometrías se almacenan en EPSG:32719. Toda geometría que entrega la API está en
    EPSG:4326 (GeoJSON, RFC 7946). Áreas en hectáreas con dos decimales; distancias en metros enteros.

    ## Datos que la API nunca entrega (RD-02, RD-04)
    Ningún esquema tiene un campo para el titular minero ni para causas o legalidad del cambio.
    Los esquemas sensibles declaran `additionalProperties: false`.

    ## Consolidación del equipo
    Se toma como contrato base la propuesta DMV por su cobertura de los criterios Must.
    Se contrastaron las alternativas AGGS, EDSM y MAA; se unifican nombres en español,
    recursos en plural, carga previa de archivos, procesamiento asíncrono de ingestas,
    y eventos históricos auditables. La decisión de usar 201 o 202 depende de si el
    recurso queda creado o si se inicia un proceso pendiente.
    Las funcionalidades Should y Could permanecen fuera del MVP, conforme al SRS.
  contact:
    name: Equipo 6 — TC5062 Gpo 10

servers:
- url: https://ecoalert.example.org/api/v1
  description: Producción (VPS, detrás de Nginx con TLS 1.2+)
- url: http://localhost:8000/api/v1
  description: Desarrollo local (Docker Compose)

security:
- bearerAuth: []

tags:
- name: Autenticación
  description: Inicio y cierre de sesión, cambio de contraseña (RF-01, RF-02)
- name: Usuarios
  description: Gestión de cuentas por la coordinación (RF-02)
- name: Archivos
  description: Subida e inspección de archivos geoespaciales antes de asignar columnas (RF-03, RF-04)
- name: Capas de referencia
  description: Versiones de las capas de referencia (RF-03, RF-07)
- name: Alertas
  description: Ingesta acumulativa de alertas de GeoBosques (RF-04, RF-05, RF-07)
- name: Trabajos
  description: Estado de los procesos asíncronos (RNF-04)
- name: Mapa
  description: Capas activables del mapa y sus elementos (RF-06, RF-07)
- name: Zonas
  description: Lista priorizada, detalle, priorización y contexto (RF-05, RF-08, RF-09, RF-10)
- name: Revisión de zonas
  description: Estados, ajustes de prioridad, marcas e historial (RF-11, RF-12, RF-13)
- name: Análisis de periodos
  description: Comparación de dos periodos y análisis almacenados (RF-14, RF-15)
- name: Exportaciones
  description: Exportación de la lista de zonas a CSV y GeoJSON (RF-16, RF-17)

paths:

  # ================================================================
  # AUTENTICACIÓN
  # ================================================================
  /auth/sesion:
    post:
      tags: [Autenticación]
      operationId: iniciarSesion
      summary: Iniciar sesión
      description: |
        Crea una sesión y entrega un JWT. El mensaje de error no revela si falló el usuario o la
        contraseña. Una cuenta desactivada no puede iniciar sesión.
      security: []
      x-roles: [publico]
      x-acceptance-criteria: [RF-01-AC-1, RF-01-AC-2, RF-01-AC-3, RF-02-AC-5]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredencialesLogin'
            example:
              usuario: ana.quispe@ecoalert.pe
              password: "clave-segura-2026"
      responses:
        '201':
          description: Sesión creada.
          headers:  # /auth/sesion
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionCreada'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          description: Credenciales incorrectas, cuenta inexistente o desactivada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: CREDENCIALES_INVALIDAS
                mensaje: Usuario o contraseña incorrectos
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
    get:
      tags: [Autenticación]
      operationId: obtenerSesionActual
      summary: Consultar la sesión actual
      description: Devuelve el usuario autenticado, su rol y si debe cambiar la contraseña.
      x-roles: [analista_sig, coordinacion]
      x-acceptance-criteria: [RF-01-AC-4, RF-01-AC-5, RF-02-AC-4]
      x-e2e-support: [RF-01-AC-7, RF-02-AC-10, RF-12-AC-18]
      responses:
        '200':
          description: Sesión vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionActual'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
    delete:
      tags: [Autenticación]
      operationId: cerrarSesion
      summary: Cerrar sesión
      description: Invalida el `jti` del token. Reutilizar el token después responde 401.
      x-roles: [analista_sig, coordinacion]
      x-acceptance-criteria: [RF-01-AC-6]
      responses:
        '204':
          description: Sesión cerrada.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'

        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
  /auth/password:
    put:
      tags: [Autenticación]
      operationId: cambiarPassword
      summary: Cambiar la contraseña propia
      description: |
        Reemplaza la contraseña del usuario autenticado. Es obligatorio en el primer ingreso con
        contraseña temporal. La nueva contraseña tiene al menos 12 caracteres (PS-15) y debe ser
        distinta de la actual.
      x-roles: [analista_sig, coordinacion]
      x-acceptance-criteria: [RF-02-AC-4]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioPassword'
      responses:
        '204':
          description: Contraseña actualizada; la cuenta deja de exigir el cambio.
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ================================================================
  # USUARIOS
  # ================================================================
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
  /usuarios:
    get:
      tags: [Usuarios]
      operationId: listarUsuarios
      summary: Listar cuentas
      x-roles: [coordinacion]
      x-acceptance-criteria: [RF-02-AC-9]
      parameters:
      - name: activo
        in: query
        required: false
        description: Filtra por cuentas activas o desactivadas.
        schema:
          type: boolean
      responses:
        '200':
          description: Lista de cuentas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
    post:
      tags: [Usuarios]
      operationId: crearUsuario
      summary: Crear una cuenta
      description: La cuenta se crea activa y con `debe_cambiar_password = true`.
      x-roles: [coordinacion]
      x-acceptance-criteria: [RF-02-AC-1, RF-02-AC-2, RF-02-AC-3, RF-02-AC-9]
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCrear'
            example:
              nombre_completo: Ana Quispe Mamani
              correo: ana.quispe@ecoalert.pe
              rol: analista_sig
              password_temporal: "Temporal-2026"
      responses:
        '201':
          description: Cuenta creada.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          description: Rol no válido o contraseña temporal demasiado corta.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rolInvalido:
                  summary: RF-02-AC-2
                  value:
                    codigo: VALIDACION
                    mensaje: El rol indicado no es válido
                    detalles:
                    - campo: rol
                      mensaje: "Roles válidos: analista_sig, coordinacion"
                passwordCorta:
                  summary: RF-02-AC-3
                  value:
                    codigo: VALIDACION
                    mensaje: La contraseña temporal es demasiado corta
                    detalles:
                    - campo: password_temporal
                      mensaje: Debe tener al menos 12 caracteres
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'

        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
  /usuarios/{usuarioId}:
    parameters:
    - $ref: '#/components/parameters/UsuarioId'
    get:
      tags: [Usuarios]
      operationId: obtenerUsuario
      summary: Consultar una cuenta
      description: La ruta no expone DELETE; un borrado responde 405 y la cuenta sigue existiendo 
        (RF-02-AC-7).
      x-roles: [coordinacion]
      x-acceptance-criteria: [RF-02-AC-7, RF-02-AC-9]
      responses:
        '200':
          description: Cuenta encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
    patch:
      tags: [Usuarios]
      operationId: actualizarUsuario
      summary: Actualizar nombre, rol o estado de la cuenta
      description: |
        Actualización parcial con JSON Merge Patch (RFC 7396): solo cambian los campos enviados.
        - `nombre_completo` y `rol`: edición de la cuenta.
        - `activo`: desactivar o reactivar. Las cuentas no se eliminan, para conservar la autoría
          en el historial (RF-02-AC-6). Al desactivar, se cierran las sesiones abiertas de la cuenta.

        Responde 409 si la operación deja al sistema sin ninguna cuenta activa de coordinación,
        ya sea por desactivarla o por cambiar su rol (RF-02-AC-8).
      x-roles: [coordinacion]
      x-acceptance-criteria: [RF-02-AC-2, RF-02-AC-5, RF-02-AC-6, RF-02-AC-8, RF-02-AC-9]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UsuarioActualizar'
            examples:
              desactivar:
                summary: RF-02-AC-5
                value:
                  activo: false
              cambiarRol:
                summary: Edición de nombre y rol
                value:
                  nombre_completo: Ana Quispe Mamani
                  rol: coordinacion
      responses:
        '200':
          description: Estado de la cuenta actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Conflicto con el estado actual de las cuentas.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ultimaCoordinacion:
                  summary: RF-02-AC-8
                  value:
                    codigo: ULTIMA_COORDINACION
                    mensaje: No se puede desactivar la última cuenta de coordinación
                ultimaCoordinacionRol:
                  summary: RF-02-AC-8 (cambio de rol)
                  value:
                    codigo: ULTIMA_COORDINACION
                    mensaje: No se puede quitar el rol a la última cuenta de coordinación
        '415':
          description: El cuerpo no usa `application/merge-patch+json`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: TIPO_CONTENIDO_NO_SOPORTADO
                mensaje: Usa Content-Type application/merge-patch+json
        '422':
          description: Campo desconocido, cuerpo vacío o rol no válido (RF-02-AC-2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: VALIDACION
                mensaje: El rol indicado no es válido
                detalles:
                - campo: rol
                  mensaje: 'Roles válidos: analista_sig, coordinacion'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ================================================================
  # ARCHIVOS
  # ================================================================
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
  /archivos:
    post:
      tags: [Archivos]
      operationId: subirArchivo
      summary: Subir e inspeccionar un archivo geoespacial
      description: |
        Primer paso de toda carga de capas o alertas. Recibe un Shapefile comprimido (.zip con
        .prj) o un GeoJSON, valida el formato y el sistema de coordenadas declarado, y devuelve
        las columnas, el tipo de geometría y el número de elementos para que el analista asigne
        las columnas. El archivo se conserva temporalmente y se referencia por `archivo_id`.
        No crea versiones de capa ni ingiere alertas.
      x-roles: [analista_sig]
      x-acceptance-criteria: [RF-03-AC-5, RF-03-AC-6, RF-03-AC-12, RF-04-AC-7]
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
                  description: Shapefile comprimido (.zip con .shp, .shx, .dbf y .prj) o GeoJSON (.geojson, 
                    .json).
      responses:
        '201':
          description: Archivo aceptado e inspeccionado.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspeccionArchivo'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          description: Formato no aceptado o archivo sin sistema de coordenadas declarado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                formatoNoAceptado:
                  summary: RF-03-AC-6
                  value:
                    codigo: FORMATO_NO_ACEPTADO
                    mensaje: "Formato no aceptado. Formatos válidos: Shapefile comprimido (.zip) o GeoJSON"
                sinPrj:
                  summary: RF-03-AC-5
                  value:
                    codigo: SRC_NO_DECLARADO
                    mensaje: El archivo no declara su sistema de coordenadas (falta el archivo .prj)
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ================================================================
  # CAPAS DE REFERENCIA
  # ================================================================
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
  /capas-referencia:
    get:
      tags: [Capas de referencia]
      operationId: listarCapasReferencia
      summary: Listar los cuatro tipos de capa de referencia
      description: |
        Para cada tipo devuelve la geometría esperada, los atributos de destino disponibles para
        asignar columnas y la versión vigente (la de fecha de corte más reciente, no la última
        cargada). El catastro minero no ofrece ningún atributo de destino para el titular.
      x-roles: [analista_sig, coordinacion]
      x-acceptance-criteria: [RF-03-AC-9, RF-03-AC-10, RF-03-AC-11, RF-07-AC-4, RF-07-AC-5]
      responses:
        '200':
          description: Tipos de capa con su versión vigente.
          content:
            application/json:
              schema:
                type: array
                minItems: 4
                maxItems: 4
                items:
                  $ref: '#/components/schemas/CapaReferencia'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'

        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
  /capas-referencia/{tipoCapa}/versiones:
    parameters:
    - $ref: '#/components/parameters/TipoCapa'
    get:
