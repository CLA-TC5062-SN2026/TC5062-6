      operationId: ejecutarComparacion
      summary: Comparar dos periodos
      description: |
        Valida los periodos (inicio ≤ fin, distintos, sin superposición), los ordena (A anterior,
        B posterior), calcula el resultado por zona y lo almacena automáticamente de forma
        inmutable. Estado:
        - `incompleto` si la última fecha de corte de las alertas es anterior al fin de B;
        - `sin_datos` si nunca se cargaron alertas;
        - `concluido` en otro caso, incluso con 0 zonas.

        Se ejecuta de forma síncrona: sobre 300 zonas responde en 60 s o menos (RNF-04).
      x-roles: [analista_sig, coordinacion]
      x-acceptance-criteria: [RF-14-AC-1, RF-14-AC-2, RF-14-AC-3, RF-14-AC-4, RF-14-AC-5, RF-14-AC-6, 
          RF-14-AC-7, RF-14-AC-8, RF-14-AC-9, RF-14-AC-10, RF-14-AC-11, RF-14-AC-12, RF-14-AC-13, RF-14-AC-15]
      parameters:
