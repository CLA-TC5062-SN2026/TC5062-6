    post:
      tags: [Revisión de zonas]
      operationId: ajustarPrioridad
      summary: Fijar un puntaje ajustado
      description: |
        Dos formas, con justificación obligatoria:
        - `por_puntaje`: valor entero de 0 a 100.
        - `por_nivel`: alta, media o baja. Si sube de nivel, el puntaje es el mínimo del nivel
          (alta = 70, media = 40); si baja, el máximo (media = 69, baja = 39). No se puede elegir
          el nivel en el que la zona ya está.

        Si ya existe un ajuste vigente, el nuevo lo reemplaza y ambos quedan en el historial.
        El puntaje calculado se sigue actualizando.
      x-roles: [analista_sig]
      x-acceptance-criteria: [RF-10-AC-9, RF-11-AC-1, RF-11-AC-2, RF-11-AC-3, RF-11-AC-7, RF-11-AC-8, 
          RF-11-AC-9, RF-11-AC-10, RF-11-AC-11, RF-11-AC-12, RF-11-AC-13]
