        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComparacionSolicitud'
            example:
              periodos:
              - {inicio: '2026-08-01', fin: '2026-08-31'}
              - {inicio: '2026-06-01', fin: '2026-06-30'}
      responses:
