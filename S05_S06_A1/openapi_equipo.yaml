                value:
                  forma: por_puntaje
                  puntaje: 80
                  justificacion: frente activo junto al límite
              porNivel:
                summary: RF-11-AC-8
                value:
                  forma: por_nivel
                  nivel: alta
                  justificacion: avance hacia la quebrada
      responses:
        '201':
          description: Ajuste registrado y vigente.
          headers:  # /zonas/{codigo}/ajustes/{ajusteId}
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AjustePrioridad'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          description: Justificación faltante, puntaje fuera de rango, nivel inválido o igual al actual. El 
            puntaje vigente no cambia.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sinJustificacion:
                  summary: RF-11-AC-2
                  value:
                    codigo: VALIDACION
                    mensaje: La justificación es obligatoria
                    detalles:
                    - campo: justificacion
                      mensaje: Campo obligatorio
                fueraDeRango:
                  summary: RF-11-AC-3
                  value:
                    codigo: VALIDACION
                    mensaje: El puntaje debe ser un entero de 0 a 100
                    detalles:
                    - campo: puntaje
                      mensaje: Rango válido de 0 a 100
                mismoNivel:
                  summary: RF-11-AC-11
                  value:
                    codigo: MISMO_NIVEL
                    mensaje: La zona ya está en el nivel "media"
                nivelInvalido:
                  summary: RF-11-AC-12
                  value:
                    codigo: VALIDACION
                    mensaje: El nivel indicado no es válido
                    detalles:
                    - campo: nivel
                      mensaje: "Niveles válidos: alta, media, baja"
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'

        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
