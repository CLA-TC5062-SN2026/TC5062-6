  /exportaciones/zonas:
    get:
      tags: [Exportaciones]
      operationId: exportarZonas
      summary: Exportar la lista filtrada de zonas
      description: |
        Usa los mismos filtros y el mismo orden que `GET /zonas`.

        **CSV** (`formato=csv`): UTF-8 con BOM (EF BB BF), separador coma, con las 10 columnas
        en este orden: `codigo,nivel,puntaje calculado,puntaje ajustado,estado,fecha de creacion,
        fecha del ultimo cambio de estado,area (ha),numero de alertas,marcas`. Los encabezados
        definitivos van en español con tildes; estados y marcas con su etiqueta legible
        (p. ej., "en revisión", "posible dinámica fluvial"); marcas separadas por ";";
        "puntaje ajustado" vacío si no hay ajuste.

        **GeoJSON** (`formato=geojson`): FeatureCollection RFC 7946 en EPSG:4326 con los atributos
        `codigo`, `nivel`, `puntaje_vigente`, `estado`, `area_ha` y `fecha_alerta_mas_reciente`,
        sin titulares.

        Si el filtro no devuelve zonas, se entrega el CSV solo con encabezados o una colección
        vacía, y la cabecera `X-Total-Zonas: 0` permite mostrar el aviso
        "La exportación no contiene zonas".
      x-roles: [analista_sig]
      x-acceptance-criteria: [RF-16-AC-1, RF-16-AC-2, RF-16-AC-3, RF-16-AC-4, RF-16-AC-5, RF-16-AC-6, 
          RF-17-AC-1, RF-17-AC-2, RF-17-AC-3, RF-17-AC-4, RF-17-AC-5, RF-17-AC-6]
      parameters:
      - name: formato
        in: query
        required: true
        schema:
          type: string
          enum: [csv, geojson]
      - $ref: '#/components/parameters/FiltroNivel'
      - $ref: '#/components/parameters/FiltroEstado'
      - $ref: '#/components/parameters/BusquedaCodigo'
      responses:
        '200':
          description: Archivo de exportación.
          headers:
            Content-Disposition:
              description: 'attachment; filename="zonas_AAAAMMDD.csv" o "zonas_AAAAMMDD.geojson"'
              schema:
                type: string
            X-Total-Zonas:
              description: Número de zonas exportadas.
              schema:
                type: integer
                minimum: 0
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/geo+json:
              schema:
                $ref: '#/components/schemas/FeatureCollection'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'

# ==================================================================
# COMPONENTES
# ==================================================================
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT firmado por el servidor con `sub` (id del usuario), `rol` y `jti` (id de sesión).
        La validez no depende solo de la firma: el servidor rechaza con 401 el token cuya
        sesión expiró por inactividad (30 min) o fue cerrada.

  headers:
    Location:
      description: URL del recurso creado o del trabajo registrado.
      schema:
        type: string
        format: uri-reference

  parameters:
    UsuarioId:
      name: usuarioId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TipoCapa:
      name: tipoCapa
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TipoCapa'
    CapaMapaId:
      name: capaMapaId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CapaMapaId'
    CodigoZona:
      name: codigo
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CodigoZona'
      example: EA-2026-014
    FiltroNivel:
      name: nivel
      in: query
      required: false
      description: Uno o varios niveles (`nivel=alta&nivel=media`).
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/NivelPrioridad'
    FiltroEstado:
      name: estado
      in: query
      required: false
      description: Uno o varios estados (`estado=en_revision`).
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/EstadoZona'
    BusquedaCodigo:
      name: q
      in: query
      required: false
      description: Búsqueda por código de zona (coincidencia exacta o prefijo).
      schema:
        type: string
        maxLength: 11
      example: EA-2026-014
    Limite:
      name: limite
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    Desplazamiento:
      name: desplazamiento
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID generado por el cliente para cada intento lógico de la operación. Repetir la misma
        clave con el mismo cuerpo durante 24 h devuelve la respuesta original (mismo código de
        estado, mismo cuerpo y mismo `Location`) sin volver a ejecutar la operación. La misma clave
        con un cuerpo distinto responde 422 con el código `IDEMPOTENCIA_CONFLICTO`.
      schema:
        type: string
        format: uuid
      example: 6f1c2d7e-4b8a-4e21-9c3d-0a7b5e9f1234
  responses:
    TrabajoAceptado:
      description: Proceso aceptado. Consultar su avance en la URL de `Location`.
      headers:
        Location:
          $ref: '#/components/headers/Location'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Trabajo'
    SolicitudMalFormada:
      description: La solicitud no se puede interpretar (JSON ilegible, multipart corrupto o parámetro con 
        sintaxis inválida).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: SOLICITUD_MAL_FORMADA
            mensaje: El cuerpo de la solicitud no es JSON válido
    NoAutenticado:
      description: Sin token, token inválido o sesión expirada o cerrada (RNF-01).
      headers:
        WWW-Authenticate:
          description: Esquema de autenticación esperado.
          schema:
            type: string
            example: Bearer realm="ecoalert", error="invalid_token"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: NO_AUTENTICADO
            mensaje: La sesión expiró o no es válida. Inicia sesión de nuevo.
    Prohibido:
      description: |
        El rol no tiene permiso para esta acción (RNF-02) o el usuario debe cambiar su contraseña
        temporal antes de continuar (RF-02-AC-4). No se modifica ningún dato.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rolNoPermitido:
              value:
                codigo: ROL_NO_PERMITIDO
                mensaje: Tu rol no permite realizar esta acción
            cambioPassword:
              value:
                codigo: CAMBIO_PASSWORD_REQUERIDO
                mensaje: Debes definir una contraseña nueva antes de continuar
    NoEncontrado:
      description: El recurso no existe.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: NO_ENCONTRADO
            mensaje: No existe la zona EA-2026-999
    Conflicto:
      description: La operación entra en conflicto con el estado actual.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            correoDuplicado:
              value:
                codigo: CORREO_DUPLICADO
                mensaje: Ya existe una cuenta con ese correo
            ultimaCoordinacion:
              value:
                codigo: ULTIMA_COORDINACION
                mensaje: No se puede quitar el rol a la última cuenta de coordinación
    ErrorValidacion:
      description: El cuerpo no cumple el esquema o una regla de negocio.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: VALIDACION
            mensaje: La solicitud contiene datos no válidos
            detalles:
            - campo: justificacion
              mensaje: Campo obligatorio
    ErrorInterno:
      description: Error interno no previsto. No se modifica ningún dato.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: ERROR_INTERNO
            mensaje: Ocurrió un error inesperado. Intenta de nuevo más tarde.

    DemasiadasSolicitudes:
      description: Se excedió el límite de solicitudes. No se procesó la solicitud.
      headers:
        Retry-After:
          description: Segundos de espera antes de reintentar.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: DEMASIADAS_SOLICITUDES
            mensaje: Demasiadas solicitudes. Espera unos segundos e intenta de nuevo.
    ServicioNoDisponible:
      description: Servicio en mantenimiento o saturado. No se procesó la solicitud.
      headers:
        Retry-After:
          description: Segundos estimados hasta que el servicio vuelva a estar disponible.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: SERVICIO_NO_DISPONIBLE
            mensaje: El servicio no está disponible en este momento. Intenta más tarde.
  schemas:

    # ---------------- Comunes ----------------
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
          description: Resumen breve del tipo de problema.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Igual a `mensaje`; se incluye por compatibilidad con RFC 9457.
        instance:
          type: string
          format: uri-reference
        codigo:
          type: string
          description: Código estable para que el cliente y las pruebas distingan el caso.
          example: VALIDACION
        mensaje:
          type: string
          description: Mensaje en español para mostrar al usuario.
        detalles:
          type: array
          items:
            type: object
            required: [campo, mensaje]
            properties:
              campo:
                type: string
              mensaje:
                type: string

      description: |
        Problem Details (RFC 9457) con miembros de extensión. `codigo` y `mensaje` son
        obligatorios y estables para el cliente y las pruebas; `type`, `title`, `status`,
        `detail` e `instance` siguen el RFC.
    UsuarioRef:
      type: object
      description: Referencia al autor de una acción. Conserva el nombre aunque la cuenta esté desactivada.
      required: [id, nombre_completo]
      properties:
        id:
          type: string
          format: uuid
        nombre_completo:
          type: string

    Pagina:
      type: object
      required: [total, limite, desplazamiento]
      properties:
        total:
          type: integer
          minimum: 0
        limite:
          type: integer
        desplazamiento:
          type: integer

    # ---------------- Enumeraciones ----------------
    Rol:
      type: string
      enum: [analista_sig, coordinacion]
    TipoCapa:
      type: string
      enum: [limite_reserva, zona_amortiguamiento, rios, catastro_minero]
    CapaMapaId:
      type: string
      enum: [limite_reserva, zona_amortiguamiento, rios, catastro_minero, alertas_geobosques, zonas_cambio]
    EstadoZona:
      type: string
      description: No existe un estado "confirmada" (RD-11).
      enum: [nueva, en_revision, requiere_verificacion, revisada, descartada]
    NivelPrioridad:
      type: string
      enum: [alta, media, baja]
    NivelVigente:
      type: string
      description: Nivel de la zona; `no_disponible` si ningún factor está disponible.
      enum: [alta, media, baja, no_disponible]
    TipoFactor:
      type: string
      enum: [ubicacion, persistencia_crecimiento, cercania_rios, superficie, recencia]
    CodigoZona:
      type: string
      pattern: '^EA-\d{4}-\d{3}$'
      example: EA-2026-014

    # ---------------- Autenticación y usuarios ----------------
    CredencialesLogin:
      type: object
      required: [usuario, password]
      additionalProperties: false
      properties:
        usuario:
          type: string
          format: email
          description: Correo de la cuenta.
        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true

    SesionCreada:
      type: object
      required: [access_token, token_type, inactividad_max_segundos, usuario]
      properties:
        access_token:
          type: string
          description: JWT con `sub`, `rol` y `jti`.
        token_type:
          type: string
          enum: [bearer]
        inactividad_max_segundos:
          type: integer
          description: Expiración por inactividad (PS-12).
          example: 1800
        usuario:
          $ref: '#/components/schemas/Usuario'

    SesionActual:
      type: object
      required: [usuario, ultima_actividad]
      properties:
        usuario:
          $ref: '#/components/schemas/Usuario'
        ultima_actividad:
          type: string
          format: date-time

    CambioPassword:
      type: object
      required: [password_actual, password_nueva]
      additionalProperties: false
      properties:
        password_actual:
          type: string
          format: password
          writeOnly: true
        password_nueva:
          type: string
          format: password
          minLength: 12
          writeOnly: true

    Usuario:
      type: object
      required: [id, nombre_completo, correo, rol, activo, debe_cambiar_password, creado_en]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nombre_completo:
          type: string
          maxLength: 120
        correo:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/Rol'
        activo:
          type: boolean
        debe_cambiar_password:
          type: boolean
        creado_en:
          type: string
          format: date-time
          readOnly: true

    UsuarioCrear:
      type: object
      required: [nombre_completo, correo, rol, password_temporal]
      additionalProperties: false
      properties:
        nombre_completo:
          type: string
          minLength: 1
          maxLength: 120
        correo:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/Rol'
        password_temporal:
          type: string
          format: password
          minLength: 12
          writeOnly: true

    UsuarioActualizar:
      type: object
      description: Campos editables de la cuenta. Al menos uno.
      additionalProperties: false
      minProperties: 1
      properties:
        nombre_completo:
          type: string
          minLength: 1
          maxLength: 120
        rol:
          $ref: '#/components/schemas/Rol'
        activo:
          type: boolean
    InspeccionArchivo:
      type: object
      required: [archivo_id, nombre, formato, src_origen, tipo_geometria, num_elementos, columnas, expira_en]
      properties:
        archivo_id:
          type: string
          format: uuid
        nombre:
          type: string
          example: catastro_madre_de_dios.zip
        formato:
          type: string
          enum: [shapefile_zip, geojson]
        src_origen:
          type: string
          description: Sistema de coordenadas declarado (del .prj o del GeoJSON).
          example: EPSG:4326
        tipo_geometria:
          type: string
          enum: [poligono, linea, punto, mixta]
        num_elementos:
          type: integer
          minimum: 0
        columnas:
          type: array
          description: Columnas del archivo disponibles para asignar.
          items:
            type: object
            required: [nombre, tipo]
            properties:
              nombre:
                type: string
              tipo:
                type: string
                enum: [texto, entero, decimal, fecha]
              ejemplos:
                type: array
                maxItems: 3
                items:
                  type: string
        expira_en:
          type: string
          format: date-time
          description: El archivo temporal se elimina después de esta fecha si no se usa.

    AtributoDestino:
      type: object
      required: [nombre, obligatorio]
      properties:
        nombre:
          type: string
          description: Para el catastro minero solo `codigo`, `tipo_derecho` y `estado`; nunca titular.
        obligatorio:
          type: boolean

    CapaReferencia:
      type: object
      required: [tipo, nombre, geometria_esperada, atributos_destino, version_vigente, texto_frescura]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoCapa'
        nombre:
          type: string
          example: Catastro minero
        geometria_esperada:
          type: string
          enum: [poligono, linea]
        atributos_destino:
          type: array
          items:
            $ref: '#/components/schemas/AtributoDestino'
        version_vigente:
          allOf:
          - $ref: '#/components/schemas/VersionCapa'
          nullable: true
          description: Versión con la fecha de corte más reciente; null si nunca se cargó.
        texto_frescura:
          type: string
          description: Fecha de corte vigente (dd/mm/aaaa) o "Sin datos cargados".
          example: 15/09/2026

    VersionCapa:
      type: object
      required: [id, tipo, fuente, fecha_corte, cargada_en, cargada_por, num_elementos, vigente]
      properties:
        id:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/TipoCapa'
        fuente:
          type: string
          example: INGEMMET
        fecha_corte:
          type: string
          format: date
        cargada_en:
          type: string
          format: date-time
        cargada_por:
          $ref: '#/components/schemas/UsuarioRef'
        num_elementos:
          type: integer
        vigente:
          type: boolean

    CargaVersionCapa:
      type: object
      required: [archivo_id, fuente, fecha_corte, mapeo_columnas]
      additionalProperties: false
      properties:
        archivo_id:
          type: string
          format: uuid
        fuente:
          type: string
          minLength: 1
          maxLength: 120
        fecha_corte:
          type: string
          format: date
        mapeo_columnas:
          type: object
          description: |
            Atributo de destino → columna del archivo. Solo se aceptan los atributos de destino
            del tipo de capa; cualquier otra clave (p. ej., `titular`) se rechaza con 422.
          additionalProperties: false
          properties:
            codigo:
              type: string
            nombre:
              type: string
            tipo_derecho:
              type: string
            estado:
              type: string

    # ---------------- Alertas y trabajos ----------------
    CargaAlertasSolicitud:
      type: object
      required: [archivo_id, fuente, fecha_corte, mapeo_columnas]
      additionalProperties: false
      properties:
        archivo_id:
          type: string
          format: uuid
        fuente:
          type: string
          enum: [GeoBosques]
          description: Única fuente Must en la v1; RADD es Should (RF-19).
        fecha_corte:
          type: string
          format: date
        mapeo_columnas:
          type: object
          required: [codigo, fecha_deteccion]
          additionalProperties: false
          properties:
            codigo:
              type: string
            fecha_deteccion:
              type: string

    CargaAlertas:
      type: object
      required: [id, fuente, fecha_corte, cargada_en, cargada_por, alertas_en_archivo, alertas_nuevas, 
          alertas_existentes, alertas_fuera_ambito, alertas_ausentes, zonas_creadas, zonas_actualizadas, 
          resumen]
      properties:
        id:
          type: string
          format: uuid
        fuente:
          type: string
        fecha_corte:
          type: string
          format: date
        cargada_en:
          type: string
          format: date-time
        cargada_por:
          $ref: '#/components/schemas/UsuarioRef'
        alertas_en_archivo:
          type: integer
        alertas_nuevas:
          type: integer
        alertas_existentes:
          type: integer
        alertas_fuera_ambito:
          type: integer
        alertas_ausentes:
          type: integer
          description: Ya ingeridas que no vienen en esta carga; se marcan como no presentes, sin borrarse.
        zonas_creadas:
          type: integer
        zonas_actualizadas:
          type: integer
        resumen:
          type: string
          example: 30 alertas nuevas, 150 ya existentes, 5 alertas fuera del ámbito

    Alerta:
      type: object
      required: [id, fuente, codigo, fecha_deteccion, fecha_ingesta, presente_en_ultima_carga, zona_codigo, 
          area_ha]
      properties:
        id:
          type: string
          format: uuid
        fuente:
          type: string
          example: GeoBosques
        codigo:
          type: string
        fecha_deteccion:
          type: string
          format: date
        fecha_ingesta:
          type: string
          format: date-time
        presente_en_ultima_carga:
          type: boolean
        zona_codigo:
          $ref: '#/components/schemas/CodigoZona'
        area_ha:
          type: number
          format: double
          multipleOf: 0.01

    PaginaAlertas:
      allOf:
      - $ref: '#/components/schemas/Pagina'
      - type: object
        required: [alertas]
        properties:
          alertas:
            type: array
            items:
              $ref: '#/components/schemas/Alerta'

    Trabajo:
      type: object
      required: [id, tipo, estado, creado_en, actualizado_en]
      properties:
        id:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [carga_capa, ingesta_alertas]
        estado:
          type: string
          enum: [pendiente, en_proceso, completado, fallido]
        creado_en:
          type: string
          format: date-time
        actualizado_en:
          type: string
          format: date-time
        mensaje_estado:
          type: string
          example: Agrupando alertas en zonas
        resultado:
          type: object
          nullable: true
          description: Presente cuando el estado es `completado`.
          properties:
            version_capa_id:
              type: string
              format: uuid
            carga_alertas_id:
              type: string
              format: uuid
        error:
          allOf:
          - $ref: '#/components/schemas/Error'
          nullable: true
          description: Presente cuando el estado es `fallido`; los datos previos no cambian.

    # ---------------- Mapa y GeoJSON ----------------
    CapaMapa:
      type: object
      required: [id, nombre, tipo_geometria, fecha_corte, texto_frescura]
      properties:
        id:
          $ref: '#/components/schemas/CapaMapaId'
        nombre:
          type: string
          example: Alertas de GeoBosques
        tipo_geometria:
          type: string
          enum: [poligono, linea]
        fecha_corte:
          type: string
          format: date
          nullable: true
          description: Null si nunca se cargó. Para zonas de cambio, la de las alertas.
        texto_frescura:
          type: string
          description: '"dd/mm/aaaa" o "Sin datos cargados".'
          example: 20/09/2026
        aviso:
          type: string
          nullable: true
          description: Solo para alertas, si el corte tiene más de 30 días.
          example: Alertas de GeoBosques posiblemente desactualizadas (corte 20/08/2026)

    Geometria:
      type: object
      description: Geometría GeoJSON (RFC 7946) en EPSG:4326.
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Point, LineString, MultiLineString, Polygon, MultiPolygon]
        coordinates:
          type: array
          items: {}

    Feature:
      type: object
      required: [type, geometry, properties]
      properties:
        type:
          type: string
          enum: [Feature]
        id:
          type: string
        geometry:
          $ref: '#/components/schemas/Geometria'
        properties:
          type: object
          description: |
            Atributos según la capa. Catastro minero: `tipo_derecho`, `codigo`, `estado`,
            `fecha_corte` (nunca titular). Zonas: `codigo`, `nivel`, `puntaje_vigente`, `estado`,
            `marcas`. Alertas: `codigo`, `fecha_deteccion`, `zona_codigo`.
          additionalProperties: true

    FeatureCollection:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            $ref: '#/components/schemas/Feature'

    # ---------------- Zonas y priorización ----------------
    Factor:
      type: object
      required: [factor, peso, disponible, valor_normalizado, aporte, aporte_texto, texto_explicativo]
      additionalProperties: false
      properties:
        factor:
          $ref: '#/components/schemas/TipoFactor'
        peso:
          type: integer
          description: Peso de la versión de pesos usada (PS-03).
          example: 35
        disponible:
          type: boolean
        valor_normalizado:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
        aporte:
          type: number
          format: double
          nullable: true
          description: Aporte en puntos sin redondear; null si no está disponible.
        aporte_texto:
          type: string
          description: Un decimal para mostrar, o "No disponible".
          example: '35.0'
        texto_explicativo:
          type: string
          example: dentro de la reserva

    Prioridad:
      type: object
      description: Puntaje calculado. Determinista para los mismos datos, versiones de capas y fecha de 
        referencia.
      required: [puntaje, nivel, fecha_referencia, version_pesos, calculado_en, factores, texto_desglose, 
          fuentes]
      additionalProperties: false
      properties:
        puntaje:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: Null si ningún factor está disponible.
        nivel:
          $ref: '#/components/schemas/NivelVigente'
        fecha_referencia:
          type: string
          format: date
          description: Fecha de referencia (FR) en America/Lima.
        version_pesos:
          type: integer
          example: 1
        calculado_en:
          type: string
          format: date-time
        factores:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: '#/components/schemas/Factor'
        texto_desglose:
          type: string
          example: dentro de la reserva; alertas en 3 de 8 semanas; a 200 m del río Malinowski
        fuentes:
          type: array
          description: Capas y fechas de corte usadas (RNF-07).
          items:
            $ref: '#/components/schemas/FuenteUsada'

    AjusteVigente:
      type: object
      required: [id, forma, puntaje_ajustado]
      properties:
        id:
          type: string
          format: uuid
        forma:
          type: string
          enum: [por_puntaje, por_nivel]
        puntaje_ajustado:
          type: integer
          minimum: 0
          maximum: 100

    MarcaResumen:
      type: object
      required: [id, tipo, texto]
      properties:
        id:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [area_pequena, posible_dinamica_fluvial, marca_analista]
        texto:
          type: string
          example: posible dinámica fluvial

    ZonaResumen:
      type: object
      required: [codigo, estado, nivel, puntaje_vigente, puntaje_calculado, ajuste_vigente, puntaje_texto, 
          factores, texto_desglose, marcas, area_ha, num_alertas, fecha_alerta_mas_reciente]
      additionalProperties: false
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoZona'
        estado:
          $ref: '#/components/schemas/EstadoZona'
        nivel:
          $ref: '#/components/schemas/NivelVigente'
        puntaje_vigente:
          type: integer
          nullable: true
          description: El ajustado si hay ajuste vigente; si no, el calculado.
        puntaje_calculado:
          type: integer
          nullable: true
        ajuste_vigente:
          allOf:
          - $ref: '#/components/schemas/AjusteVigente'
          nullable: true
        puntaje_texto:
          type: string
          description: Texto listo para mostrar.
          example: 80 (ajustado; calculado 45)
        factores:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: '#/components/schemas/Factor'
        texto_desglose:
          type: string
        marcas:
          type: array
          items:
            $ref: '#/components/schemas/MarcaResumen'
        area_ha:
          type: number
          format: double
          multipleOf: 0.01
        num_alertas:
          type: integer
          minimum: 1
        fecha_alerta_mas_reciente:
          type: string
          format: date

    ConteosZonas:
      type: object
      required: [por_nivel, por_estado]
      properties:
        por_nivel:
          type: object
          required: [alta, media, baja, no_disponible]
          properties:
            alta: {type: integer, minimum: 0}
            media: {type: integer, minimum: 0}
            baja: {type: integer, minimum: 0}
            no_disponible: {type: integer, minimum: 0}
        por_estado:
          type: object
          required: [nueva, en_revision, requiere_verificacion, revisada, descartada]
          properties:
            nueva: {type: integer, minimum: 0}
            en_revision: {type: integer, minimum: 0}
            requiere_verificacion: {type: integer, minimum: 0}
            revisada: {type: integer, minimum: 0}
            descartada: {type: integer, minimum: 0}

    ListaZonas:
      allOf:
      - $ref: '#/components/schemas/Pagina'
      - type: object
        required: [alertas_al, aviso_frescura, conteos, zonas, mensaje]
        properties:
          alertas_al:
            type: string
            nullable: true
            description: '"Alertas al dd/mm/aaaa"; null si nunca se cargaron alertas.'
            example: Alertas al 20/09/2026
          aviso_frescura:
            type: string
            nullable: true
            example: Alertas de GeoBosques posiblemente desactualizadas (corte 20/08/2026)
          conteos:
            $ref: '#/components/schemas/ConteosZonas'
          zonas:
            type: array
            items:
              $ref: '#/components/schemas/ZonaResumen'
          mensaje:
            type: string
            nullable: true
            description: Mensaje de sin resultados cuando ninguna zona cumple el filtro.
            example: No hay zonas que cumplan el filtro

    SuperposicionArea:
      type: object
      required: [capa, codigo, nombre, fecha_corte]
      additionalProperties: false
      properties:
        capa:
          type: string
          enum: [limite_reserva, zona_amortiguamiento]
        codigo:
          type: string
        nombre:
          type: string
        fecha_corte:
          type: string
          format: date

    SuperposicionMinera:
      type: object
      description: Sin titular (RD-04).
      required: [capa, tipo_derecho, codigo, estado, fecha_corte]
      additionalProperties: false
      properties:
        capa:
          type: string
          enum: [catastro_minero]
        tipo_derecho:
          type: string
          enum: [concesion, petitorio]
        codigo:
          type: string
        estado:
          type: string
        fecha_corte:
          type: string
          format: date

    Superposicion:
      oneOf:
      - $ref: '#/components/schemas/SuperposicionArea'
      - $ref: '#/components/schemas/SuperposicionMinera'
      discriminator:
        propertyName: capa
        mapping:
          limite_reserva: '#/components/schemas/SuperposicionArea'
          zona_amortiguamiento: '#/components/schemas/SuperposicionArea'
          catastro_minero: '#/components/schemas/SuperposicionMinera'

    RioCercano:
      type: object
      description: |
        Si no hay capa de ríos, `disponible` es false, `mensaje` es "Información no disponible" y
        no se incluyen `distancia_m` ni `nombre` (RF-08-AC-7).
      required: [disponible]
      additionalProperties: false
      properties:
        disponible:
          type: boolean
        distancia_m:
          type: integer
          minimum: 0
          description: Distancia mínima en metros, EPSG:32719; 0 si la zona cruza el río.
        nombre:
          type: string
          nullable: true
          example: Malinowski
        texto:
          type: string
          example: 'Río Malinowski: 212 m'
        fecha_corte:
          type: string
          format: date
        mensaje:
          type: string
          example: Información no disponible

    ContextoTerritorial:
      type: object
      description: Datos espaciales, no conclusiones; sin calificaciones de legalidad ni de actividad (RD-02).
      required: [superposiciones, mensaje_superposiciones, rio_cercano, fuentes]
      additionalProperties: false
      properties:
        superposiciones:
          type: array
          items:
            $ref: '#/components/schemas/Superposicion'
        mensaje_superposiciones:
          type: string
          nullable: true
          description: '"No hay superposiciones" cuando la lista está vacía.'
        rio_cercano:
          $ref: '#/components/schemas/RioCercano'
        fuentes:
          type: array
          description: Capas usadas con su fecha de corte, p. ej. "Catastro minero, corte 15/09/2026".
          items:
            $ref: '#/components/schemas/FuenteUsada'

    ZonaDetalle:
      type: object
      required: [codigo, estado, nivel, puntaje_vigente, puntaje_texto, ajuste_vigente, prioridad, contexto, 
          marcas, area_ha, num_alertas, fecha_alerta_mas_reciente, creada_en, fecha_ultimo_cambio_estado, 
          geometria]
      additionalProperties: false
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoZona'
        estado:
          $ref: '#/components/schemas/EstadoZona'
        nivel:
          $ref: '#/components/schemas/NivelVigente'
        puntaje_vigente:
          type: integer
          nullable: true
        puntaje_texto:
          type: string
          example: 70 (ajustado por nivel; calculado 45)
        ajuste_vigente:
          allOf:
          - $ref: '#/components/schemas/AjusteVigente'
          nullable: true
        prioridad:
          $ref: '#/components/schemas/Prioridad'
        contexto:
          $ref: '#/components/schemas/ContextoTerritorial'
        marcas:
          type: array
          description: Marcas activas.
          items:
            $ref: '#/components/schemas/Marca'
        area_ha:
          type: number
          format: double
          multipleOf: 0.01
          example: 2.0
        num_alertas:
          type: integer
          minimum: 1
        fecha_alerta_mas_reciente:
          type: string
          format: date
        creada_en:
          type: string
          format: date-time
        fecha_ultimo_cambio_estado:
          type: string
          format: date-time
          nullable: true
        geometria:
          $ref: '#/components/schemas/Geometria'

    # ---------------- Revisión ----------------
    CambioEstadoSolicitud:
      type: object
      required: [estado_nuevo]
      additionalProperties: false
      properties:
        estado_nuevo:
          $ref: '#/components/schemas/EstadoZona'
        texto:
          type: string
          maxLength: 1000
          description: Comentario o motivo; obligatorio según la transición.

    AjusteSolicitud:
      oneOf:
      - $ref: '#/components/schemas/AjustePorPuntaje'
      - $ref: '#/components/schemas/AjustePorNivel'
      discriminator:
        propertyName: forma
        mapping:
          por_puntaje: '#/components/schemas/AjustePorPuntaje'
          por_nivel: '#/components/schemas/AjustePorNivel'

    AjustePorPuntaje:
      type: object
      required: [forma, puntaje, justificacion]
      additionalProperties: false
      properties:
        forma:
          type: string
          enum: [por_puntaje]
        puntaje:
          type: integer
          minimum: 0
          maximum: 100
        justificacion:
          type: string
          minLength: 1
          maxLength: 1000

    AjustePorNivel:
      type: object
      required: [forma, nivel, justificacion]
      additionalProperties: false
      properties:
        forma:
          type: string
          enum: [por_nivel]
        nivel:
          $ref: '#/components/schemas/NivelPrioridad'
        justificacion:
          type: string
          minLength: 1
          maxLength: 1000

    AjustePrioridad:
      type: object
      required: [id, forma, nivel_elegido, puntaje_ajustado, puntaje_calculado_al_ajustar, justificacion, 
          estado, creado_en, creado_por]
      properties:
        id:
          type: string
          format: uuid
        forma:
          type: string
          enum: [por_puntaje, por_nivel]
        nivel_elegido:
          allOf:
          - $ref: '#/components/schemas/NivelPrioridad'
          nullable: true
          description: Solo cuando la forma es `por_nivel`.
        puntaje_ajustado:
          type: integer
          minimum: 0
          maximum: 100
        puntaje_calculado_al_ajustar:
          type: integer
          nullable: true
        justificacion:
          type: string
        estado:
          type: string
          enum: [vigente, reemplazado, retirado]
        creado_en:
          type: string
          format: date-time
        creado_por:
          $ref: '#/components/schemas/UsuarioRef'
        retirado_en:
          type: string
          format: date-time
          nullable: true
        retirado_por:
          allOf:
          - $ref: '#/components/schemas/UsuarioRef'
          nullable: true
        justificacion_retiro:
          type: string
          nullable: true

    RetiroAjusteSolicitud:
      type: object
      required: [estado, justificacion_retiro]
      additionalProperties: false
      properties:
        estado:
          type: string
          enum: [retirado]
        justificacion_retiro:
          type: string
          minLength: 1
          maxLength: 1000

    Marca:
      type: object
      required: [id, tipo, origen, texto, activa, creada_en]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        tipo:
          type: string
          description: Las automáticas solo pueden ser de los dos tipos definidos (RF-13-AC-9).
          enum: [area_pequena, posible_dinamica_fluvial, marca_analista]
        origen:
          type: string
          enum: [automatica, analista]
        rotulo:
          type: string
          description: '"Marca del analista" para las del analista.'
          example: Marca del analista
        texto:
          type: string
          example: posible actividad minera
        activa:
          type: boolean
        creada_en:
          type: string
          format: date-time
        creada_por:
          allOf:
          - $ref: '#/components/schemas/UsuarioRef'
          nullable: true
          description: Null en las marcas automáticas.
        retirada_en:
          type: string
          format: date-time
          nullable: true
        retirada_por:
          allOf:
          - $ref: '#/components/schemas/UsuarioRef'
          nullable: true
        motivo_retiro:
          type: string
          nullable: true

    MarcaAnalistaSolicitud:
      type: object
      required: [texto]
      additionalProperties: false
      properties:
        texto:
          type: string
          minLength: 1
          maxLength: 500

    RetiroMarcaSolicitud:
      type: object
      required: [activa, motivo_retiro]
      additionalProperties: false
      properties:
        activa:
          type: boolean
          enum: [false]
        motivo_retiro:
          type: string
          minLength: 1
          maxLength: 1000

    EntradaHistorial:
      type: object
      description: |
        Entrada de la lista cronológica única. Los campos opcionales dependen de `tipo_accion`:
        - `zona_creada`: `codigo_alerta_origen` (usuario "Sistema").
        - `cambio_estado`: `estado_anterior`, `estado_nuevo`, `texto`.
        - `ajuste_fijado` / `ajuste_retirado`: `ajuste_id`, `forma`, `nivel_elegido`,
          `puntaje_calculado`, `puntaje_ajustado`, `texto` (justificación).
        - `marca_registrada` / `marca_retirada`: `marca_id`, `texto_marca`, `texto` (motivo del retiro).
      required: [id, tipo_accion, fecha_hora, autor]
      properties:
        id:
          type: string
          format: uuid
        tipo_accion:
          type: string
          enum: [zona_creada, cambio_estado, ajuste_fijado, ajuste_retirado, marca_registrada, marca_retirada]
        fecha_hora:
          type: string
          format: date-time
        autor:
          type: object
          required: [tipo, nombre]
          properties:
            tipo:
              type: string
              enum: [usuario, sistema]
            id:
              type: string
              format: uuid
              nullable: true
            nombre:
              type: string
              example: Sistema
        codigo_alerta_origen:
          type: string
        estado_anterior:
          $ref: '#/components/schemas/EstadoZona'
        estado_nuevo:
          $ref: '#/components/schemas/EstadoZona'
        ajuste_id:
          type: string
          format: uuid
        forma:
          type: string
          enum: [por_puntaje, por_nivel]
        nivel_elegido:
          $ref: '#/components/schemas/NivelPrioridad'
        puntaje_calculado:
          type: integer
        puntaje_ajustado:
          type: integer
        marca_id:
          type: string
          format: uuid
        texto_marca:
          type: string
        texto:
          type: string
          nullable: true

    # ---------------- Análisis ----------------
    Periodo:
      type: object
      required: [inicio, fin]
      additionalProperties: false
      properties:
        inicio:
          type: string
          format: date
        fin:
          type: string
          format: date

    ComparacionSolicitud:
      type: object
      required: [periodos]
      additionalProperties: false
      properties:
        periodos:
          type: array
          description: Dos periodos en cualquier orden; el servidor asigna A (anterior) y B (posterior).
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/Periodo'

    FuenteUsada:
      type: object
      required: [fuente, fecha_corte]
      properties:
        capa:
          type: string
          example: Catastro minero
        fuente:
          type: string
          example: INGEMMET
        fecha_corte:
          type: string
          format: date

    ResultadoZona:
      type: object
      description: Instantánea del momento del análisis; no cambia después (RF-14-AC-14).
      required: [codigo_zona, alertas_a, alertas_b, area_a_ha, area_b_ha, diferencia_ha, presencia, nivel, 
          puntaje, estado]
      additionalProperties: false
      properties:
        codigo_zona:
          $ref: '#/components/schemas/CodigoZona'
        alertas_a:
          type: integer
          minimum: 0
        alertas_b:
          type: integer
          minimum: 0
        area_a_ha:
          type: number
          format: double
          multipleOf: 0.01
        area_b_ha:
          type: number
          format: double
          multipleOf: 0.01
        diferencia_ha:
          type: number
          format: double
          multipleOf: 0.01
          description: Área B − área A.
        presencia:
          type: string
          enum: [solo_a, solo_b, en_ambos]
        nivel:
          $ref: '#/components/schemas/NivelVigente'
        puntaje:
          type: integer
          nullable: true
        estado:
          $ref: '#/components/schemas/EstadoZona'

    AnalisisResumen:
      type: object
      required: [id, ejecutado_en, ejecutado_por, periodo_a, periodo_b, estado]
      properties:
        id:
          type: string
          format: uuid
        ejecutado_en:
          type: string
          format: date-time
        ejecutado_por:
          $ref: '#/components/schemas/UsuarioRef'
        periodo_a:
          $ref: '#/components/schemas/Periodo'
        periodo_b:
          $ref: '#/components/schemas/Periodo'
        estado:
          type: string
          enum: [concluido, incompleto, sin_datos]

    Analisis:
      allOf:
      - $ref: '#/components/schemas/AnalisisResumen'
      - type: object
        required: [fuentes, limitaciones, mensaje, resultados]
        properties:
          fuentes:
            type: array
            items:
              $ref: '#/components/schemas/FuenteUsada'
          limitaciones:
            type: array
            items:
              type: string
            example: ['Las alertas están cargadas hasta 20/08/2026; el periodo B termina después']
          mensaje:
            type: string
            nullable: true
            example: No se identificaron zonas con alertas en los periodos analizados
          resultados:
            type: array
            description: Ordenados por puntaje vigente como en RF-10. Vacío si el estado es `sin_datos`.
            items:
              $ref: '#/components/schemas/ResultadoZona'

    ListaAnalisis:
      allOf:
      - $ref: '#/components/schemas/Pagina'
      - type: object
        required: [analisis, mensaje]
        properties:
          analisis:
            type: array
            items:
              $ref: '#/components/schemas/AnalisisResumen'
          mensaje:
            type: string
            nullable: true
            example: Aún no hay análisis almacenados
x-consolidation-decisions:
- id: C-01
  tema: Nomenclatura
  decision: Rutas en español, recursos plurales y prefijo /api/v1.
- id: C-02
  tema: Cierre de sesión
  decision: DELETE /auth/sesion; respuesta 204 sin cuerpo.
- id: C-03
  tema: Cambio de contraseña
  decision: PUT /auth/password; respuesta 204.
- id: C-04
  tema: Actualización de usuarios
  decision: PATCH /usuarios/{usuarioId} parcial; sin PUT ni DELETE de cuentas.
- id: C-05
  tema: Archivos
  decision: POST /archivos y referencia al archivo en las cargas; evita duplicar la subida.
- id: C-06
  tema: Capas de referencia
  decision: POST /capas-referencia/{tipoCapa}/versiones; versiones explícitas.
- id: C-07
  tema: Ingesta
  decision: POST /cargas-alertas devuelve 202 y se consulta el estado de procesamiento.
- id: C-08
  tema: Cambio de estado
  decision: POST /zonas/{codigo}/cambios-estado crea transición histórica (201).
- id: C-09
  tema: Retiro de ajustes
  decision: PATCH sobre ajuste; retiro justificado sin borrado físico y con historial.
- id: C-10
  tema: Retiro de marcas
  decision: PATCH sobre marca; retiro justificado sin borrado físico y con historial.
- id: C-11
  tema: Comparación de periodos
  decision: POST /analisis devuelve 201 con resultado inmutable.
- id: C-12
  tema: Exportación
  decision: GET /exportaciones/zonas con formato CSV o GeoJSON documentado.
