  /zonas/{codigo}/cambios-estado:
    parameters:
    - $ref: '#/components/parameters/CodigoZona'
    post:
      tags: [Revisión de zonas]
      operationId: cambiarEstadoZona
      summary: Cambiar el estado de revisión de una zona
      description: |
        Solo se aceptan las transiciones de la tabla de RF-12:

        | Desde | Hacia | Texto |
        |---|---|---|
        | nueva | en_revision | opcional |
        | nueva | descartada | obligatorio (motivo) |
        | en_revision | revisada | obligatorio |
        | en_revision | requiere_verificacion | obligatorio |
        | en_revision | descartada | obligatorio (motivo) |
        | requiere_verificacion | revisada | obligatorio |
        | requiere_verificacion | en_revision | obligatorio (motivo) |
        | revisada / descartada | en_revision | obligatorio (reapertura; conserva el ajuste) |

        "Revisada" significa que el analista terminó la revisión; no confirma causa ni legalidad (RD-11).
      x-roles: [analista_sig]
      x-acceptance-criteria: [RF-12-AC-2, RF-12-AC-3, RF-12-AC-4, RF-12-AC-5, RF-12-AC-6, RF-12-AC-7, 
          RF-12-AC-8, RF-12-AC-9, RF-12-AC-10, RF-12-AC-11, RF-12-AC-12, RF-12-AC-13, RF-12-AC-14, RF-12-AC-16]
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioEstadoSolicitud'
            example:
              estado_nuevo: requiere_verificacion
              texto: posibles pozas junto al afluente
      responses:
        '201':
          description: Transición registrada en el historial.
          headers:  # /zonas/{codigo}/historial/{entradaId}
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntradaHistorial'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          description: Estado inexistente, transición fuera de la tabla o texto obligatorio faltante. El 
            estado no cambia.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                estadoInexistente:
                  summary: RF-12-AC-2
                  value:
                    codigo: VALIDACION
                    mensaje: El estado indicado no existe
                    detalles:
                    - campo: estado_nuevo
                      mensaje: "Estados válidos: nueva, en_revision, requiere_verificacion, revisada, descartada"
                transicionNoPermitida:
                  summary: RF-12-AC-10
                  value:
                    codigo: TRANSICION_NO_PERMITIDA
                    mensaje: No se permite pasar de "nueva" a "revisada"
                motivoFaltante:
                  summary: RF-12-AC-5
                  value:
                    codigo: VALIDACION
                    mensaje: El motivo es obligatorio para descartar una zona
                    detalles:
                    - campo: texto
                      mensaje: Campo obligatorio para esta transición
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'

        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
